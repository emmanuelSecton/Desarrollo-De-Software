# Configuracion solo por variables de entorno (D13). Sin valores sensibles por defecto.
# Las variables obligatorias se declaran con ":" vacio para que AppProperties falle
# con un mensaje que nombra la variable (APP_BASE_URL, DB_URL).
spring:
  application:
    name: odonto
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Instantes siempre en UTC (RN-GL-02), sin importar la zona del host.
        jdbc:
          time_zone: UTC
  flyway:
    validate-on-migrate: true
    placeholders:
      "[runtime_role]": ${APP_DB_USER:app_runtime}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  # Email por SMTP (C-04). Sin SMTP_HOST el envio queda deshabilitado y la app arranca igual.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  web:
    locale: es-AR
    locale-resolver: fixed

app:
  base-url: ${APP_BASE_URL:}
  timezone: ${APP_TIMEZONE:America/Argentina/Buenos_Aires}
  db-url: ${DB_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  # Un SMTP caido no debe marcar la instancia como DOWN: el envio ya reintenta y se registra (C-04).
  health:
    mail:
      enabled: false

# Remitente y reintentos del email (C-04, D1/D2).
notificaciones:
  email:
    remitente: ${MAIL_FROM:turnos@ejemplo.com.ar}
    esperas-reintento: 1s,3s

# Identidad y seguridad (C-03). Las credenciales iniciales solo se usan si no hay odontologo (D2).
identidad:
  email-inicial: ${ADMIN_INITIAL_EMAIL:}
  clave-inicial: ${ADMIN_INITIAL_PASSWORD:}
  inactividad-sesion: 30m
  login-por-minuto: ${RATE_LIMIT_LOGIN_POR_MINUTO:10}
  publico-por-minuto: ${RATE_LIMIT_PUBLICO_POR_MINUTO:60}

# Pacientes (C-09): version de la politica de privacidad que acepta cada paciente (RN-DP-01).
pacientes:
  politica-privacidad-version: ${POLITICA_PRIVACIDAD_VERSION:v0-provisoria}

server:
  servlet:
    session:
      # RN-SEG-04 y DD-08: 30 min de inactividad; cookie HttpOnly, Secure y SameSite=Strict.
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: strict
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

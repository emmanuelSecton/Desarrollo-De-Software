name: odonto

services:
  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      APP_DB_NAME: ${APP_DB_NAME:-}
      APP_DB_MIGRATOR_USER: ${APP_DB_MIGRATOR_USER:-}
      APP_DB_MIGRATOR_PASSWORD: ${APP_DB_MIGRATOR_PASSWORD:-}
      APP_DB_USER: ${APP_DB_USER:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      CONSULTORIO_SLUGS: ${CONSULTORIO_SLUGS:-demo_uno demo_dos}
      CONSULTORIO_DEMO_UNO_MIGRATOR_PASSWORD: ${CONSULTORIO_DEMO_UNO_MIGRATOR_PASSWORD:-}
      CONSULTORIO_DEMO_UNO_RUNTIME_PASSWORD: ${CONSULTORIO_DEMO_UNO_RUNTIME_PASSWORD:-}
      CONSULTORIO_DEMO_DOS_MIGRATOR_PASSWORD: ${CONSULTORIO_DEMO_DOS_MIGRATOR_PASSWORD:-}
      CONSULTORIO_DEMO_DOS_RUNTIME_PASSWORD: ${CONSULTORIO_DEMO_DOS_RUNTIME_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 512m
    networks:
      - backend

  migrate:
    image: flyway/flyway:11.7.2
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${APP_DB_NAME:-consultorio}
      FLYWAY_USER: ${APP_DB_MIGRATOR_USER:-}
      FLYWAY_PASSWORD: ${APP_DB_MIGRATOR_PASSWORD:-}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_PLACEHOLDERS_RUNTIME_ROLE: ${APP_DB_USER:-app_runtime}
    command: migrate
    volumes:
      - ../backend/src/main/resources/db/migration:/flyway/sql:ro
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 256m
    networks:
      - backend

  app:
    image: ${ODONTO_IMAGEN:-odonto:1.0.0}
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${APP_DB_NAME:-consultorio}
      DB_USER: ${APP_DB_USER:-}
      DB_PASSWORD: ${APP_DB_PASSWORD:-}
      SPRING_FLYWAY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    networks:
      - backend

  migrate_demo_uno:
    image: flyway/flyway:11.7.2
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/consultorio_demo_uno
      FLYWAY_USER: consultorio_demo_uno_migrator
      FLYWAY_PASSWORD: ${CONSULTORIO_DEMO_UNO_MIGRATOR_PASSWORD:-}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_PLACEHOLDERS_RUNTIME_ROLE: consultorio_demo_uno_runtime
    command: migrate
    volumes:
      - ../backend/src/main/resources/db/migration:/flyway/sql:ro
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 256m
    networks:
      - backend

  app_demo_uno:
    image: ${ODONTO_IMAGEN:-odonto:1.0.0}
    restart: unless-stopped
    env_file:
      - path: ${ODONTO_ENV_DIR:-../instances}/demo_uno.env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/consultorio_demo_uno
      DB_USER: consultorio_demo_uno_runtime
      DB_PASSWORD: ${CONSULTORIO_DEMO_UNO_RUNTIME_PASSWORD:-}
      DB_POOL_MAX_SIZE: "5"
      SPRING_FLYWAY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate_demo_uno:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    networks:
      - backend

  migrate_demo_dos:
    image: flyway/flyway:11.7.2
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/consultorio_demo_dos
      FLYWAY_USER: consultorio_demo_dos_migrator
      FLYWAY_PASSWORD: ${CONSULTORIO_DEMO_DOS_MIGRATOR_PASSWORD:-}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_PLACEHOLDERS_RUNTIME_ROLE: consultorio_demo_dos_runtime
    command: migrate
    volumes:
      - ../backend/src/main/resources/db/migration:/flyway/sql:ro
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 256m
    networks:
      - backend

  app_demo_dos:
    image: ${ODONTO_IMAGEN:-odonto:1.0.0}
    restart: unless-stopped
    env_file:
      - path: ${ODONTO_ENV_DIR:-../instances}/demo_dos.env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/consultorio_demo_dos
      DB_USER: consultorio_demo_dos_runtime
      DB_PASSWORD: ${CONSULTORIO_DEMO_DOS_RUNTIME_PASSWORD:-}
      DB_POOL_MAX_SIZE: "5"
      SPRING_FLYWAY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate_demo_dos:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    networks:
      - backend

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      ODONTO_DOMINIO: ${ODONTO_DOMINIO:-demo.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 128m
    networks:
      - backend

networks:
  backend:

volumes:
  pgdata:
  caddy_data:
  caddy_config:

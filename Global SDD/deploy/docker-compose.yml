# Base compartida dev/demo (D12). Desarrollo: sumar docker-compose.override.yml (Compose lo carga solo).
# Uso desde "Global SDD/":
#   docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml up -d --build
name: odonto

services:
  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      APP_DB_NAME: ${APP_DB_NAME:-consultorio}
      APP_DB_MIGRATOR_USER: ${APP_DB_MIGRATOR_USER:-}
      APP_DB_MIGRATOR_PASSWORD: ${APP_DB_MIGRATOR_PASSWORD:-}
      APP_DB_USER: ${APP_DB_USER:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    # Sin "ports": la base no se publica en el archivo base (solo el override de desarrollo).

  # Servicio de un solo uso: aplica V1/V2 con el migrator y termina con exito.
  migrate:
    image: flyway/flyway:11.7.2
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${APP_DB_NAME:-consultorio}
      FLYWAY_USER: ${APP_DB_MIGRATOR_USER:-}
      FLYWAY_PASSWORD: ${APP_DB_MIGRATOR_PASSWORD:-}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_PLACEHOLDERS_RUNTIME_ROLE: ${APP_DB_USER:-app_runtime}
    command: migrate
    volumes:
      - ../backend/src/main/resources/db/migration:/flyway/sql:ro
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: odonto:dev
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      # Una sola fuente de verdad para la base: las APP_DB_* de la instancia.
      DB_URL: jdbc:postgresql://postgres:5432/${APP_DB_NAME:-consultorio}
      DB_USER: ${APP_DB_USER:-}
      DB_PASSWORD: ${APP_DB_PASSWORD:-}
      # Flyway corre solo en "migrate" (DDL); la app corre con el runtime (solo SELECT/INSERT).
      # Este flag vive SOLO aqui: los tests dependen de Flyway a nivel de aplicacion.
      SPRING_FLYWAY_ENABLED: "false"
      # Odontologo inicial (C-03, D2): solo se usan si la instancia no tiene odontologo.
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      # Cupos por IP y por minuto (C-03, D10); vacios toman los valores por defecto (10 y 60).
      RATE_LIMIT_LOGIN_POR_MINUTO: ${RATE_LIMIT_LOGIN_POR_MINUTO:-10}
      RATE_LIMIT_PUBLICO_POR_MINUTO: ${RATE_LIMIT_PUBLICO_POR_MINUTO:-60}
      # Version de la politica de privacidad que aceptan los pacientes (C-09, RN-DP-01).
      POLITICA_PRIVACIDAD_VERSION: ${POLITICA_PRIVACIDAD_VERSION:-v0-provisoria}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # El HEALTHCHECK viene definido en la imagen (deploy/Dockerfile).
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    networks:
      - backend

networks:
  backend:

volumes:
  pgdata:

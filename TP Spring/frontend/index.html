<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD de Facturas de Venta</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; background: #f6f8fa; color: #222; }
        h1 { margin-bottom: 16px; }
        section { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2 { margin-top: 0; font-size: 1.15rem; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
        label { display: flex; flex-direction: column; font-size: 0.85rem; font-weight: 600; gap: 4px; }
        input, select, button { padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 0.9rem; }
        button { cursor: pointer; border: none; background: #2563eb; color: #fff; font-weight: 600; }
        button:hover { background: #1d4ed8; }
        button.sec { background: #64748b; }
        button.sec:hover { background: #475569; }
        button.warn { background: #d97706; }
        button.warn:hover { background: #b45309; }
        button.danger { background: #dc2626; }
        button.danger:hover { background: #b91c1c; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9rem; }
        th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: left; }
        th { background: #f1f5f9; }
        .acciones { display: flex; gap: 6px; }
        #mensaje { margin-bottom: 12px; font-weight: 600; }
        .ok { color: #15803d; }
        .err { color: #b91c1c; }
    </style>
</head>
<body>
    <h1>Gestión de Facturas de Venta</h1>
    <div id="mensaje"></div>

    <!-- SECCIÓN 1: Búsqueda con filtros -->
    <section>
        <h2>1. Buscar y Filtrar Facturas</h2>
        <form id="formFiltros">
            <div class="grid">
                <label>Fecha Desde <input type="date" id="filtroFechaDesde" /></label>
                <label>Fecha Hasta <input type="date" id="filtroFechaHasta" /></label>
                <label>Estado
                    <select id="filtroEstado">
                        <option value="">Todos</option>
                        <option value="EMITIDA">EMITIDA</option>
                        <option value="ANULADA">ANULADA</option>
                        <option value="PENDIENTE">PENDIENTE</option>
                    </select>
                </label>
                <label>Monto Mínimo <input type="number" step="0.01" id="filtroMontoMinimo" placeholder="Ej: 10000" /></label>
            </div>
            <button type="submit">Buscar</button>
            <button type="button" id="btnLimpiarFiltros" class="sec">Limpiar</button>
        </form>
    </section>

    <!-- SECCIÓN 2: Alta de factura con tabla dinámica de ítems -->
    <section>
        <h2>2. Nueva Factura</h2>
        <form id="formFactura">
            <div class="grid">
                <label>Número * <input type="number" id="numero" required /></label>
                <label>Fecha Emisión * <input type="date" id="fechaEmision" required /></label>
                <label>Cliente ID (vacío = Cons. Final) <input type="number" id="clienteId" placeholder="Ej: 1" /></label>
                <label>Condición IVA ID * <input type="number" id="condicionIvaId" value="1" required /></label>
                <label>Punto de Venta ID * <input type="number" id="puntoVentaId" value="1" required /></label>
                <label>Tipo Moneda ID * <input type="number" id="tipoMonedaId" value="1" required /></label>
                <label>Observaciones <input type="text" id="observaciones" placeholder="Opcional" /></label>
            </div>

            <h3>Ítems / Detalles de la Factura</h3>
            <div class="grid">
                <label>Artículo ID * <input type="number" id="itemArticuloId" value="1" /></label>
                <label>Descripción <input type="text" id="itemDescripcion" placeholder="Opcional" /></label>
                <label>Cantidad * <input type="number" step="0.01" id="itemCantidad" value="1" /></label>
                <label>Precio Unit. (opcional) <input type="number" step="0.01" id="itemPrecio" placeholder="Usa lista si vacío" /></label>
                <label>% Bonificación <input type="number" step="0.01" id="itemBonificacion" value="0" /></label>
            </div>
            <button type="button" id="btnAgregarItem" class="sec">+ Agregar Ítem</button>

            <table>
                <thead>
                    <tr>
                        <th>Artículo ID</th>
                        <th>Descripción</th>
                        <th>Cantidad</th>
                        <th>Precio Unit.</th>
                        <th>% Bonif.</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaDetallesBody"></tbody>
            </table>

            <br />
            <button type="submit">Guardar Factura</button>
        </form>
    </section>

    <!-- SECCIÓN 3: Listado de comprobantes -->
    <section>
        <h2>3. Listado de Facturas Registradas</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Número</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Cond. IVA</th>
                    <th>Pto. Venta</th>
                    <th>Ítems</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaFacturasBody"></tbody>
        </table>
    </section>

    <script type="module" src="./dist/app.js"></script>
</body>
</html>

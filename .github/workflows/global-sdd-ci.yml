name: Global SDD CI

# Workflow del proyecto "Global SDD/", que vive en una subcarpeta de este repositorio.
# Solo corre cuando cambia esa carpeta (o este archivo): no se dispara por los otros TPs.
on:
  push:
    paths:
      - 'Global SDD/**'
      - '.github/workflows/global-sdd-ci.yml'
  pull_request:
    paths:
      - 'Global SDD/**'
      - '.github/workflows/global-sdd-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Gradle build + Testcontainers + JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Global SDD/backend'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: 'Global SDD/backend'
      # Docker ya viene en ubuntu-latest: los tests de integracion usan Testcontainers (PostgreSQL 16).
      - name: Build, tests, arquitectura y cobertura
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: 'Global SDD/backend/build/reports/jacoco/test/html'
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, formato, tipos, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Global SDD/frontend'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'Global SDD/frontend/.nvmrc'
          cache: npm
          cache-dependency-path: 'Global SDD/frontend/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  imagen:
    name: Imagen Docker (sin push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: 'Global SDD'
    steps:
      - uses: actions/checkout@v4
      - name: Calcular tag semántico
        id: tag
        run: |
          tag="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo '1.0.0')"
          echo "tag=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build de la imagen
        run: docker build -f deploy/Dockerfile -t "odonto:${{ steps.tag.outputs.tag }}" -t odonto:ci .
      - name: Reportar digest
        run: |
          digest="$(docker image inspect odonto:ci --format '{{.Id}}')"
          echo "digest=${digest}"
          echo "::notice title=Imagen construida::tag=${{ steps.tag.outputs.tag }} digest=${digest}"
